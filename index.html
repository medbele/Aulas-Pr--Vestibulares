<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedVest - Módulos de Estudo & Casos Clínicos</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuração da Paleta Médica -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            med: {
              100: '#F3FBFF',
              200: '#CDEFFF',
              300: '#7AD9FF',
              400: '#1AA3D9',
              500: '#123B4A',
              900: '#0B242E',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    select optgroup { background-color: #123B4A; color: #7AD9FF; font-weight: bold; }
    select option { background-color: #0B242E; color: #F3FBFF; }
  </style>
</head>
<body class="bg-med-900 text-med-100 min-h-screen flex flex-col font-sans selection:bg-med-400 selection:text-med-100">

  <!-- Cabeçalho -->
  <header class="border-b border-med-400/30 bg-med-500/90 backdrop-blur sticky top-0 z-50 px-4 py-3 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-med-400/20 border border-med-300/40 rounded-xl text-med-300 text-xl shadow-inner">
          🩺
        </div>
        <div>
          <h1 class="font-bold text-lg md:text-xl text-med-100 flex items-center gap-2">
            MedVest <span class="text-xs px-2 py-0.5 rounded-full bg-med-400/30 border border-med-300/50 text-med-200">UFPR / Medicina</span>
          </h1>
          <p class="text-xs text-med-200/80">Estudo Fragmentado por Balões de Leitura</p>
        </div>
      </div>

      <!-- Gamificação -->
      <div class="flex items-center gap-4 bg-med-900/90 px-4 py-2 rounded-xl border border-med-400/30 text-xs md:text-sm">
        <div class="flex items-center gap-1.5">
          <span>🩺</span>
          <span id="user-level" class="font-semibold text-med-300">Interno de Medicina</span>
        </div>
        <div class="h-4 w-px bg-med-400/30"></div>
        <div class="flex items-center gap-1.5">
          <span>⚡</span>
          <span id="user-xp" class="font-bold text-med-200">0 XP</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">

    <!-- Seletor de Aulas -->
    <div class="flex flex-col gap-2 bg-med-500 p-4 rounded-xl border border-med-400/40 shadow-xl">
      <label for="lesson-select" class="font-semibold text-med-200 flex items-center gap-2 text-sm md:text-base">
        📚 Selecionar Disciplina e Módulo:
      </label>
      <select id="lesson-select" onchange="carregarAula(this.value)" class="w-full bg-med-900 border border-med-400/60 rounded-lg px-4 py-3 text-med-100 font-medium focus:outline-none focus:ring-2 focus:ring-med-300 transition-all cursor-pointer">
        <option value="">A carregar sumário...</option>
      </select>
    </div>

    <!-- Título do Módulo e Vídeo -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <div class="bg-med-500 border border-med-400/30 rounded-xl overflow-hidden shadow-2xl aspect-video relative">
          <iframe id="video-player" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="bg-med-500 p-4 rounded-xl border border-med-400/30">
          <h2 id="lesson-title" class="text-lg font-bold text-med-100">A carregar...</h2>
          <p id="lesson-desc" class="text-sm text-med-200/90 mt-1"></p>
        </div>
      </div>

      <!-- Secção de Balões de Leitura -->
      <div class="space-y-4">
        <h3 class="font-bold text-med-300 text-sm flex items-center gap-2">
          💬 BALÕES DE LEITURA (CLIQUE PARA ABRIR):
        </h3>
        
        <div id="balloons-list" class="grid grid-cols-1 gap-2">
          <p class="text-xs text-med-200">Selecione uma aula acima para carregar os balões.</p>
        </div>
      </div>
    </div>

    <!-- Área de Exibição do Balão Ativo -->
    <div id="active-balloon-container" class="hidden bg-med-500 p-6 rounded-xl border-2 border-med-300/50 space-y-6 shadow-2xl transition-all">
      <div class="border-b border-med-400/30 pb-3 flex justify-between items-center">
        <h3 id="balloon-title" class="text-lg font-bold text-med-300 flex items-center gap-2"></h3>
        <span class="text-xs bg-med-400/20 text-med-200 px-3 py-1 rounded-full border border-med-300/30">Fragmento de Leitura</span>
      </div>

      <div id="balloon-text" class="text-sm md:text-base text-med-100 leading-relaxed bg-med-900/60 p-4 rounded-lg border border-med-400/20"></div>

      <div class="space-y-4 bg-med-900 p-5 rounded-xl border border-med-400/30">
        <p id="balloon-question" class="font-semibold text-sm md:text-base text-med-300"></p>
        <div id="balloon-options" class="space-y-2"></div>
        
        <button id="btn-submit-balloon" onclick="validarRespostaBalao()" class="w-full py-2.5 bg-gradient-to-r from-med-400 to-med-300 hover:brightness-110 font-bold rounded-lg text-med-900 shadow-lg transition-all text-sm mt-2">
          🩺 Confirmar Diagnóstico
        </button>
      </div>

      <div id="balloon-feedback" class="hidden"></div>
    </div>

  </main>

  <footer class="border-t border-med-500 bg-med-900 py-6 text-center text-xs text-med-200/60">
    MedVest UFPR &copy; 2026 - Preparatório para Medicina
  </footer>

  <script>
    let xpAtual = parseInt(localStorage.getItem('medvest_xp') || '0');
    let aulaDados = null;
    let balaoAtual = null;

    function atualizarInterfaceGamificada() {
      document.getElementById('user-xp').innerText = `${xpAtual} XP`;
      let nivel = "Interno de Medicina";
      if (xpAtual >= 500) nivel = "Residente Clínico";
      if (xpAtual >= 1200) nivel = "Médico Especialista";
      if (xpAtual >= 2500) nivel = "Cirurgião Chefe";
      document.getElementById('user-level').innerText = nivel;
    }

    async function carregarSumario() {
      const select = document.getElementById('lesson-select');
      try {
        // Previne cache usando timestamp
        const res = await fetch('./sumario.json?v=' + Date.now());
        if (!res.ok) throw new Error(`Ficheiro não encontrado (HTTP ${res.status})`);
        
        const disciplinas = await res.json();
        select.innerHTML = "";

        disciplinas.forEach(disc => {
          const optgroup = document.createElement('optgroup');
          optgroup.label = disc.disciplina;

          disc.modulos.forEach(mod => {
            const option = document.createElement('option');
            option.value = mod.arquivo;
            option.innerText = mod.titulo;
            optgroup.appendChild(option);
          });

          select.appendChild(optgroup);
        });

        if (select.value) carregarAula(select.value);

      } catch (err) {
        console.error("Erro ao carregar sumario.json:", err);
        select.innerHTML = `<option value="">⚠️ Erro: ${err.message}</option>`;
      }
    }

    async function carregarAula(nomeArquivo) {
      if (!nomeArquivo) return;
      document.getElementById('active-balloon-container').classList.add('hidden');
      
      try {
        const resposta = await fetch('./' + nomeArquivo + '?v=' + Date.now());
        if (!resposta.ok) throw new Error(`Ficheiro da aula não encontrado (HTTP ${resposta.status})`);
        
        aulaDados = await resposta.json();

        document.getElementById('lesson-title').innerText = aulaDados.titulo || "Módulo de Estudo";
        document.getElementById('lesson-desc').innerText = aulaDados.descricao || "";
        
        if (aulaDados.youtube_id) {
          document.getElementById('video-player').src = `https://www.youtube.com/embed/${aulaDados.youtube_id}`;
        } else {
          document.getElementById('video-player').src = "";
        }

        renderizarBaloes();

      } catch (erro) {
        document.getElementById('lesson-title').innerText = "Módulo Não Carregado";
        document.getElementById('lesson-desc').innerText = `O ficheiro ${nomeArquivo} ainda não está pronto ou tem um erro de formato.`;
        document.getElementById('video-player').src = "";
        document.getElementById('balloons-list').innerHTML = `<p class="text-med-300 text-xs">⚠️ ${erro.message}</p>`;
      }
    }

    function renderizarBaloes() {
      const list = document.getElementById('balloons-list');
      list.innerHTML = "";

      if (!aulaDados.baloes || aulaDados.baloes.length === 0) {
        list.innerHTML = `<p class="text-xs text-med-200">Nenhum balão de leitura cadastrado neste módulo.</p>`;
        return;
      }

      aulaDados.baloes.forEach((b, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 rounded-lg bg-med-900 hover:bg-med-400/20 border border-med-400/30 text-med-100 font-medium text-xs md:text-sm flex items-center justify-between transition-all group";
        btn.onclick = () => abrirBalao(index);
        btn.innerHTML = `
          <span class="flex items-center gap-2">💬 <span>${b.titulo_balao}</span></span>
          <span class="text-med-300 group-hover:translate-x-1 transition-transform">➔</span>
        `;
        list.appendChild(btn);
      });
    }

    function abrirBalao(index) {
      balaoAtual = aulaDados.baloes[index];
      
      document.getElementById('balloon-title').innerText = balaoAtual.titulo_balao;
      document.getElementById('balloon-text').innerText = balaoAtual.explicacao;
      document.getElementById('balloon-question').innerText = balaoAtual.pergunta;

      const optionsContainer = document.getElementById('balloon-options');
      optionsContainer.innerHTML = "";

      balaoAtual.opcoes.forEach((opt, i) => {
        const label = document.createElement('label');
        label.className = "flex items-center gap-3 p-3 rounded-lg bg-med-500/60 hover:bg-med-400/30 cursor-pointer text-xs md:text-sm text-med-100 transition-colors border border-transparent hover:border-med-300/40";
        label.innerHTML = `
          <input type="radio" name="balloon_option" value="${i}" class="text-med-400 focus:ring-med-300">
          <span>${opt}</span>
        `;
        optionsContainer.appendChild(label);
      });

      document.getElementById('balloon-feedback').className = "hidden";
      const container = document.getElementById('active-balloon-container');
      container.classList.remove('hidden');
      container.scrollIntoView({ behavior: 'smooth' });
    }

    function validarRespostaBalao() {
      if (!balaoAtual) return;

      const selected = document.querySelector('input[name="balloon_option"]:checked');
      const feedback = document.getElementById('balloon-feedback');

      if (!selected) {
        alert("Por favor, selecione uma opção antes de confirmar.");
        return;
      }

      const valor = parseInt(selected.value);
      if (valor === balaoAtual.correta) {
        feedback.className = "p-4 rounded-xl text-xs md:text-sm bg-med-900 border border-med-300 text-med-300 shadow-lg space-y-2";
        feedback.innerHTML = `
          <p class="font-bold text-sm">🎉 Diagnóstico Correto (+20 XP)!</p>
          <p class="text-med-100">${balaoAtual.gabarito_comentado || "Excelente raciocínio!"}</p>
        `;
        xpAtual += 20;
        localStorage.setItem('medvest_xp', xpAtual);
        atualizarInterfaceGamificada();
      } else {
        feedback.className = "p-4 rounded-xl text-xs md:text-sm bg-med-900 border border-amber-400/50 text-amber-300 shadow-lg space-y-2";
        feedback.innerHTML = `
          <p class="font-bold text-sm">⚠️ Hipótese Incorreta.</p>
          <p class="text-med-100">${balaoAtual.gabarito_comentado || "Revise o texto do balão acima e tente novamente."}</p>
        `;
      }

      feedback.classList.remove('hidden');
    }

    // Inicialização
    atualizarInterfaceGamificada();
    carregarSumario();
  </script>
</body>
</html>
