<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Microlearning - Pré-Vestibular</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Cabeçalho -->
    <header class="text-center border-b pb-4">
      <h1 class="text-3xl font-bold text-blue-700">Aula 1: Pré-Vestibular</h1>
      <p class="text-gray-600">Aprenda em pequenos blocos interativos</p>
    </header>

    <!-- Contentor do Vídeo -->
    <div class="aspect-video w-full rounded-xl overflow-hidden shadow-lg bg-black">
      <iframe id="youtube-player" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- Contentor dos Fragmentos da Aula -->
    <div id="fragmentos-container" class="space-y-6">
      <p class="text-center text-gray-500">A carregar conteúdo da aula...</p>
    </div>

  </div>

  <script>
    // Procura o ficheiro JSON armazenado no GitHub
    fetch('aula1.json')
      .then(response => response.json())
      .then(data => {
        // Carrega o vídeo do YouTube
        document.getElementById('youtube-player').src = `https://www.youtube.com/embed/${data.video_id}`;
        
        const container = document.getElementById('fragmentos-container');
        container.innerHTML = '';

        // Renderiza cada fragmento pedagógico
        data.fragmentos.forEach((frag, index) => {
          const card = document.createElement('div');
          card.className = "bg-white p-6 rounded-xl shadow-md border border-gray-200 space-y-4";
          
          let opcoesHTML = frag.opcoes.map((opt, i) => `
            <button onclick="verificarResposta(${index}, ${i}, ${frag.resposta_correta})" 
                    class="opcao-btn-${index} w-full text-left p-3 rounded-lg border hover:bg-blue-50 transition border-gray-300">
              ${opt}
            </button>
          `).join('');

          card.innerHTML = `
            <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded font-semibold">
              Parte ${frag.id}
            </span>
            <h2 class="text-xl font-bold text-gray-900">${frag.titulo}</h2>
            <p class="text-gray-700 leading-relaxed">${frag.explicacao}</p>
            
            <div class="pt-4 border-t mt-4">
              <p class="font-semibold text-gray-800 mb-3">❓ ${frag.pergunta}</p>
              <div class="space-y-2">${opcoesHTML}</div>
              <div id="feedback-${index}" class="hidden mt-3 p-3 rounded-lg text-sm font-medium"></div>
            </div>
          `;
          
          container.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('fragmentos-container').innerHTML = 
          '<p class="text-red-500 text-center">Erro ao carregar o ficheiro aula1.json do repositório.</p>';
      });

    function verificarResposta(fragIndex, opcaoSelecionada, correta) {
      const feedback = document.getElementById(`feedback-${fragIndex}`);
      const botoes = document.querySelectorAll(`.opcao-btn-${fragIndex}`);
      
      botoes.forEach((btn, i) => {
        btn.disabled = true;
        if (i === correta) {
          btn.classList.add('bg-green-100', 'border-green-500', 'font-semibold');
        } else if (i === opcaoSelecionada) {
          btn.classList.add('bg-red-100', 'border-red-500');
        }
      });

      feedback.classList.remove('hidden');
      if (opcaoSelecionada === correta) {
        feedback.className = "mt-3 p-3 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-200";
        feedback.innerText = "✨ Correto! Parabéns!";
      } else {
        feedback.className = "mt-3 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-200";
        feedback.innerText = "❌ Incorreto. Reveja o trecho explicativo acima.";
      }
    }
  </script>
</body>
</html>
